name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Guard merge conflict markers
        run: |
          grep -RIn --exclude-dir=.git --exclude-dir=artifacts --exclude-dir=.venv --exclude-dir=venv -E "^(<<<<<<<|=======|>>>>>>>)" . > /tmp/merge_markers.txt || true
          if [ -s /tmp/merge_markers.txt ]; then
            cat /tmp/merge_markers.txt
            echo "Merge conflict markers detected. Remove <<<<<<< ======= >>>>>>> lines and resolve conflicts."
            exit 1
          fi
      - name: Guard workflow placeholders
        run: |
          grep -RIn -E "TODO_[A-Z]+" .github/workflows > /tmp/workflow_placeholders.txt || true
          if [ -s /tmp/workflow_placeholders.txt ]; then
            cat /tmp/workflow_placeholders.txt
            echo "Workflow placeholders detected in .github/workflows. Move templates to docs/ and replace TODO_* placeholders."
            exit 1
          fi
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
