name: RepoBrain Remote Stub Test

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  issues: write
  pull-requests: write

jobs:
  remote-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Start TKY stub server
        run: |
          nohup python -m repobrain.tky_stub_server --host 127.0.0.1 --port 8787 > /tmp/tky-stub.log 2>&1 &
          sleep 1
      - name: Run RepoBrain action in remote mode (stub)
        uses: ./. 
        with:
          tky_mode: remote
          remote_url: "http://127.0.0.1:8787/v1/tky/decide"
          enable_hmac: "false"
          dry_run: "true"
          comment_text: "/repobrain ask Где реализована логика TKYProvider?"
