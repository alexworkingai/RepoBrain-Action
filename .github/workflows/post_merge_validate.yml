name: Post Merge Validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Env reference guard
        run: python scripts/check_env_reference_up_to_date.py
      - name: Usersafe guard
        run: python scripts/usersafe_scan.py
      - name: TKYA contract guard
        run: python scripts/check_tkya_contract_guard.py
      - name: Generate release notes
        run: python scripts/release/gen_release_notes.py
      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: repobrain-release-notes
          path: artifacts/release_notes.md
          if-no-files-found: error
