name: RepoBrain

on:
  issue_comment:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  repobrain:
    runs-on: ubuntu-latest
    if: startsWith(github.event.comment.body, '/repobrain') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./. 
        with:
          tky_mode: "baseline"
          dry_run: "false"
