name: Canary Runtime Wiring

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      RB_TOPOCORE_BACKEND: "auto"
      RB_TKYA_ALLOW_REMOTE: "0"
      RB_TKYA_STRICT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Guard env reference is up to date
        run: python scripts/check_env_reference_up_to_date.py
      - name: Guard usersafe outputs
        run: python scripts/usersafe_scan.py
      - name: Guard TKYA contract
        run: python scripts/check_tkya_contract_guard.py
      - name: Tests
        run: pytest -q
