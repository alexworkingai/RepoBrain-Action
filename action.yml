name: "RepoBrain Local MVP"
description: "Run RepoBrain in GitHub Actions (dry-run by default)"

inputs:
  tky_mode:
    description: "TKY provider mode: auto|baseline|remote|local"
    required: false
    default: "auto"
  remote_url:
    description: "Remote TKY endpoint URL"
    required: false
    default: ""
  api_key:
    description: "Remote TKY API key"
    required: false
    default: ""
  hmac_secret:
    description: "Optional HMAC secret for Remote TKY payload signing"
    required: false
    default: ""
  enable_hmac:
    description: "Enable HMAC signing for Remote TKY requests"
    required: false
    default: "false"
  dry_run:
    description: "If true, print comment instead of publishing to GitHub"
    required: false
    default: "true"
  issue_number:
    description: "Issue number to post comment to (digits only; # prefix also accepted)"
    required: false
    default: ""
  comment_text:
    description: "Optional comment text for workflow_dispatch dry-run tests"
    required: false
    default: ""
  topocore_backend:
    description: "TopoCore backend for lab/runtime selection: v5, v6, or auto"
    required: false
    default: "v5"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Upgrade pip
      shell: bash
      run: python -m pip install -U pip
    - name: Install dependencies
      shell: bash
      run: pip install -e ".[dev]"
    - name: Run RepoBrain GitHub dry-run wiring
      shell: bash
      env:
        RB_TOPOCORE_BACKEND: ${{ inputs.topocore_backend }}
        RB_TKYA_BACKEND: "v5"
        RB_TKYA_ALLOW_REMOTE: "0"
        RB_TKYA_STRICT: "0"
        RB_DISABLE_INTERNAL_REACTIONS: "1"
        RB_INDEX_CACHE_RESTORED: ${{ env.RB_INDEX_CACHE_RESTORED }}
        GITHUB_TOKEN: ${{ github.token }}
      run: >
        python scripts/run_github.py
        --dry-run "${{ inputs.dry_run }}"
        --issue-number "${{ inputs.issue_number }}"
        --tky-mode "${{ inputs.tky_mode }}"
        --remote-url "${{ inputs.remote_url }}"
        --api-key "${{ inputs.api_key }}"
        --hmac-secret "${{ inputs.hmac_secret }}"
        --enable-hmac "${{ inputs.enable_hmac }}"
        --comment-text "${{ inputs.comment_text }}"
