name: RepoBrain

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = print only, false = post to issue"
        required: false
        default: "true"
        type: string
      comment_text:
        description: "RepoBrain command text"
        required: false
        default: ""
        type: string
      issue_number:
        description: "Issue number (optional for issue_comment; digits or #N for manual mode)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  models: read
  checks: read
  statuses: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  repobrain:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/repobrain')
    steps:
      - uses: actions/github-script@v7
        id: ack
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/repobrain')
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comment_id = context.payload.comment.id;
            const res = await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id, content: "eyes"
            });
            core.setOutput("reaction_id", String(res.data.id));
      - uses: actions/checkout@v4
      - name: Restore RepoBrain index cache
        id: index_cache
        uses: actions/cache@v4
        with:
          path: artifacts/index-package.zip
          key: repobrain-index-main-${{ github.sha }}
          restore-keys: |
            repobrain-index-main-
      - uses: ./. 
        env:
          RB_INDEX_CACHE_RESTORED: ${{ steps.index_cache.outputs.cache-hit == 'true' && '1' || '' }}
          RB_TRUSTED_CONTEXT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RB_ALLOW_DYNAMIC_VERIFY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RB_APPLY_PATCH: "0"
          RB_CREATE_PR: "0"
          RB_REQUIRE_VERIFY_FOR_PATCH: "0"
          RB_FAIL_ON_NOT_RUN: "0"
          RB_LLM_ENABLED: "0"
          RB_LLM_PROVIDER: ""
          RB_LLM_MODEL_HIGH: "openai/gpt-4.1"
          RB_LLM_MODEL_LOW: "openai/gpt-4.1-mini"
          RB_LLM_MAX_INPUT_TOKENS: "7600"
          RB_LLM_MAX_OUTPUT_TOKENS_GLOBAL: "2000"
          RB_LLM_MAX_OUTPUT_TOKENS_ASK: "1000"
          RB_LLM_MAX_OUTPUT_TOKENS_REVIEW: "1400"
          RB_LLM_MAX_OUTPUT_TOKENS_FIX: "2000"
          RB_LLM_ALLOW_LOCATE: "0"
          RB_LLM_BATCH_ENABLE: "0"
          RB_LLM_BATCH_MAX_CALLS_PER_RUN: "6"
          RB_LLM_BATCH_REDUCE_ENABLE: "1"
          RB_LLM_BATCH_REDUCE_MODEL: ""
          RB_EMBED_ENABLED: "0"
          RB_EMBED_MODEL: "openai/text-embedding-3-small"
          RB_EMBED_BATCH_SIZE: "64"
          RB_RETRIEVAL_VECTOR_TOPK: "30"
          RB_RETRIEVAL_W_LEX: "0.55"
          RB_RETRIEVAL_W_VEC: "0.45"
          RB_AI_STOP_AT_REMAINING: "1"
          RB_AI_MIN_REMAINING_BUFFER: "2"
          RB_AI_MAX_LLM_CALLS_PER_RUN: "6"
          RB_AI_MAX_EMBED_CALLS_PER_RUN: "10"
          RB_AI_DISABLE_REDUCE_WHEN_REMAINING_LT: "3"
          RB_AI_SWITCH_TO_MINI_WHEN_REMAINING_LT: "5"
          RB_AI_DISABLE_EMBED_WHEN_REMAINING_LT: "3"
          RB_AI_ESTIMATE_MODE_CONSERVATIVE: "1"
          RB_AI_MAX_TOKENS_PER_RUN_LLM: "12000"
          RB_AI_MAX_TOKENS_PER_RUN_EMBED: "200000"
          RB_AI_TIME_BUDGET_S: "240"
        with:
          # remote_url intentionally not set here; use repobrain_remote_stub_test.yml for stub remote tests.
          tky_mode: "auto"
          dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          comment_text: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.comment_text || '' }}
          issue_number: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || '' }}
      - uses: actions/github-script@v7
        if: always() && github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/repobrain')
        env:
          REACTION_ID: ${{ steps.ack.outputs.reaction_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comment_id = context.payload.comment.id;
            const reaction_id = process.env.REACTION_ID;
            if (reaction_id) {
              try {
                await github.rest.reactions.deleteForIssueComment({
                  owner, repo, comment_id, reaction_id: Number(reaction_id)
                });
              } catch (e) {
                // ignore
              }
            }
            const status = (process.env.JOB_STATUS || "").toLowerCase();
            const content = status === "success" ? "rocket" : "confused";
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id, content });
      - name: Upload RepoBrain audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-audit
          path: artifacts/audit/*.json
          if-no-files-found: ignore
      - name: Upload RepoBrain ask markdown artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-ask-result
          path: artifacts/ask_result.md
          if-no-files-found: ignore
      - name: Upload RepoBrain patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-patch
          path: artifacts/patch.diff
          if-no-files-found: ignore
      - name: Upload RepoBrain patch parts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-patch-parts
          path: artifacts/patch_parts/*
          if-no-files-found: ignore
      - name: Upload RepoBrain verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-verification
          path: artifacts/verification_report.json
          if-no-files-found: ignore
      - name: Upload RepoBrain batch summaries artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-batch-summaries
          path: artifacts/batch_summaries.json
          if-no-files-found: ignore
      - name: Upload RepoBrain check-run payload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-check-run-payload
          path: artifacts/check_run_payload.json
          if-no-files-found: ignore
      - name: Upload RepoBrain LLM usage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-llm-usage
          path: artifacts/llm_usage.json
          if-no-files-found: ignore
      - name: Upload RepoBrain embeddings usage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-embeddings-usage
          path: artifacts/embeddings_usage.json
          if-no-files-found: ignore
      - name: Upload RepoBrain AI quota snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-ai-quota-snapshot
          path: artifacts/ai_quota_snapshot.json
          if-no-files-found: ignore
