name: RepoBrain Local Test

on:
  workflow_dispatch:
    inputs:
      topocore_backend:
        description: "TopoCore backend for local test: auto|v6"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - v6
      topocore_v6_require_local:
        description: "Require a local/private TopoCore v6 dependency during the dry run"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./. 
        env:
          RB_TOPOCORE_BACKEND: ${{ github.event.inputs.topocore_backend || 'auto' }}
          RB_TKYA_ALLOW_REMOTE: "0"
          RB_TOPOCORE_V6_REQUIRE_LOCAL: ${{ github.event.inputs.topocore_v6_require_local || 'false' }}
        with:
          dry_run: "true"
          comment_text: "/repobrain ask Где реализована логика TKYProvider?"
      - name: Upload RepoBrain audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-audit
          path: artifacts/audit/*.json
          if-no-files-found: ignore
