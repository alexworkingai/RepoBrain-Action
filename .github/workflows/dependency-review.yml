name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: github.event.repository.visibility == 'public' || vars.RB_ENABLE_PRIVATE_DEPENDENCY_REVIEW == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v5
