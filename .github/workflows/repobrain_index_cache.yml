name: RepoBrain Index Cache

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Build RepoBrain index
        run: python scripts/run_index.py
      - name: Save index to cache
        uses: actions/cache@v4
        with:
          path: artifacts/index-package.zip
          key: repobrain-index-main-${{ github.sha }}
          restore-keys: |
            repobrain-index-main-
      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-index-package
          path: artifacts/index-package.zip
