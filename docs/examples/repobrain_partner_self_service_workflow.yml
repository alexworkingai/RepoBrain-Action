name: RepoBrain Partner Self-Service

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  repobrain:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/repobrain')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: alexworkingai/RepoBrain-Action@main
        with:
          profile: partner-pilot
          terms_accepted: "true"
          api_url: https://repobrain.example.invalid
          oidc_audience: repobrain-api
          # Sprint 93D wires the end-to-end self-service request/response path.
          # Keep a placeholder URL here until a trusted-partner endpoint is assigned.
          self_service_mode: "true"
