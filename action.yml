name: "RepoBrain Action"
description: "GitHub-native repository intelligence action for evidence-grounded questions, review guidance, informational verify, and safe no-patch fix proposals"

inputs:
  tky_mode:
    description: "TKY provider mode: auto|baseline|remote|local"
    required: false
    default: "auto"
  remote_url:
    description: "Remote TKY endpoint URL"
    required: false
    default: ""
  api_key:
    description: "Remote TKY API key"
    required: false
    default: ""
  hmac_secret:
    description: "Optional HMAC secret for Remote TKY payload signing"
    required: false
    default: ""
  enable_hmac:
    description: "Enable HMAC signing for Remote TKY requests"
    required: false
    default: "false"
  dry_run:
    description: "If true, print comment instead of publishing to GitHub"
    required: false
    default: "true"
  profile:
    description: "Optional self-service profile metadata for the GitHub OIDC identity envelope; does not activate hosted provisioning by itself"
    required: false
    default: "partner-pilot"
  issue_number:
    description: "Issue number to post comment to (digits only; # prefix also accepted)"
    required: false
    default: ""
  comment_text:
    description: "Optional comment text for workflow_dispatch dry-run tests"
    required: false
    default: ""
  topocore_backend:
    description: "TopoCore backend for lab/runtime selection: auto or v6 (legacy v5/lite envs are unsupported)"
    required: false
    default: "auto"
  terms_accepted:
    description: "Optional self-service terms acknowledgement; required only when explicit experimental self_service_mode is enabled"
    required: false
    default: "false"
  api_url:
    description: "Optional hosted RepoBrain API URL for experimental and future external-runtime mode; not the default GitHub-native beta path"
    required: false
    default: ""
  oidc_audience:
    description: "Optional GitHub OIDC audience for the action-side identity envelope"
    required: false
    default: "repobrain-api"
  self_service_mode:
    description: "Optional experimental hosted self-service mode; enables OIDC and terms gating plus hosted request routing for supported commands when a real external runtime exists"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Upgrade pip
      shell: bash
      run: python -m pip install -U pip
    - name: Install dependencies
      shell: bash
      run: pip install -e "${GITHUB_ACTION_PATH}[dev]"
    - name: Run RepoBrain GitHub dry-run wiring
      shell: bash
      env:
        RB_TOPOCORE_BACKEND: ${{ env.RB_TOPOCORE_BACKEND || inputs.topocore_backend }}
        RB_TKYA_ALLOW_REMOTE: "0"
        RB_TKYA_STRICT: "0"
        RB_DISABLE_INTERNAL_REACTIONS: "1"
        RB_INDEX_CACHE_RESTORED: ${{ env.RB_INDEX_CACHE_RESTORED }}
        RB_SELF_SERVICE_PROFILE: ${{ inputs.profile }}
        RB_SELF_SERVICE_TERMS_ACCEPTED: ${{ inputs.terms_accepted }}
        RB_SELF_SERVICE_API_URL: ${{ inputs.api_url }}
        RB_SELF_SERVICE_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        RB_SELF_SERVICE_MODE: ${{ inputs.self_service_mode }}
        GITHUB_TOKEN: ${{ github.token }}
      run: >
        python "${GITHUB_ACTION_PATH}/scripts/run_github.py"
        --dry-run "${{ inputs.dry_run }}"
        --issue-number "${{ inputs.issue_number }}"
        --tky-mode "${{ inputs.tky_mode }}"
        --remote-url "${{ inputs.remote_url }}"
        --api-key "${{ inputs.api_key }}"
        --hmac-secret "${{ inputs.hmac_secret }}"
        --enable-hmac "${{ inputs.enable_hmac }}"
        --comment-text "${{ inputs.comment_text }}"
        --repo-root "${{ github.workspace }}"

branding:
  icon: "search"
  color: "blue"
