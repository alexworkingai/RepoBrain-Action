# RepoBrain Partner Self-Service

name: RepoBrain beta

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  repobrain:
    if: >
      startsWith(github.event.comment.body, '/repobrain score') ||
      startsWith(github.event.comment.body, '/repobrain audit')
    runs-on: ubuntu-latest
    steps:
      - uses: alexworkingai/RepoBrain-Action@main
        with:
          profile: partner-pilot
          terms_accepted: "true"
          transport_mode: github_app_queue

# Default GitHub-native beta path in Sprint 94C:
# - install RepoBrain GitHub App when invited
# - grant selected repository access
# - use github_app_queue to create a public-safe queue marker
# - final score and audit reports require the private control worker in Sprint 94D
# Trusted beta is not ready until Sprint 94E validation.

# Experimental hosted external-runtime mode retained for documentation only:
# api_url: https://repobrain.example.invalid
# oidc_audience: repobrain-api
# self_service_mode: "true"
# A real external runtime is required before hosted mode can be used live.
# Do not use this hosted path as the default trusted beta setup.
# Do not use the hosted path as the default trusted beta setup.

# Planned GitHub-native beta path after Sprint 94C:
# - partner repo uses the public RepoBrain action surface
# - GitHub App provides installation identity and scoped repo access
# - RepoBrain request is queued through GitHub-native control-plane plumbing
# - a private control worker executes through private TopoCore
