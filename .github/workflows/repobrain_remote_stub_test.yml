name: RepoBrain Remote Stub Test

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  issues: write
  pull-requests: read

jobs:
  remote-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Start TKY stub server
        run: |
          nohup python -m repobrain.tky_stub_server --host 127.0.0.1 --port 8787 > /tmp/tky-stub.log 2>&1 &
          sleep 1
      - name: Diagnostic config check
        run: |
          echo "Config exists?"
          ls -la .repobrain.yml || true
      - name: Run RepoBrain action in remote mode (stub)
        uses: ./.
        with:
          tky_mode: auto
          remote_url: "http://127.0.0.1:8787/v1/tky/decide"
          enable_hmac: "false"
          dry_run: "true"
          comment_text: "/repobrain ask Где реализована логика TKYProvider?"
      - name: Verify remote was used (audit)
        if: always()
        run: |
          ls -la artifacts/audit || true
          cat artifacts/audit/*.json || true
          grep -R "\"remote_used\": true" artifacts/audit/*.json
      - name: Upload RepoBrain audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repobrain-audit
          path: artifacts/audit/*.json
          if-no-files-found: ignore
