name: RepoBrain

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = print only, false = post to issue"
        required: false
        default: "true"
        type: string
      comment_text:
        description: "RepoBrain command text"
        required: false
        default: ""
        type: string
      issue_number:
        description: "Issue number (optional for issue_comment; digits or #N for manual mode)"
        required: false
        default: ""
        type: string
      enable_llm:
        description: "Enable LLM path for workflow_dispatch run"
        required: false
        default: false
        type: boolean
      enable_embeddings:
        description: "Enable embeddings path for workflow_dispatch run"
        required: false
        default: false
        type: boolean
      enable_batch_llm:
        description: "Enable batch LLM path for workflow_dispatch run"
        required: false
        default: false
        type: boolean
      batch_force:
        description: "Force batch LLM path for workflow_dispatch run"
        required: false
        default: false
        type: boolean
      trusted_context:
        description: "Enable trusted_context for workflow_dispatch run"
        required: false
        default: false
        type: boolean
      allow_dynamic_verify:
        description: "Enable dynamic verification for workflow_dispatch run"
        required: false
        default: false
        type: boolean
      apply_patch:
        description: "Enable patch apply for workflow_dispatch run"
        required: false
        default: false
        type: boolean
      create_pr:
        description: "Enable PR creation for workflow_dispatch run"
        required: false
        default: false
        type: boolean
      e2e_command:
        description: "E2E simulated /repobrain command for workflow_dispatch"
        required: false
        default: ""
        type: string
      e2e_pr_number:
        description: "E2E PR number for workflow_dispatch simulation"
        required: false
        default: ""
        type: string
      e2e_ref:
        description: "E2E source ref (informational)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  models: read
  checks: write
  statuses: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  repobrain:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/repobrain')
    env:
      RB_TRUSTED_CONTEXT: "0"
      RB_ALLOW_DYNAMIC_VERIFY: "0"
      RB_APPLY_PATCH: "0"
      RB_CREATE_PR: "0"
      RB_LLM_ENABLED: "1"
      RB_LLM_PROVIDER: "github_models"
      RB_LLM_ENABLE_ISSUE_COMMENT: "1"
      RB_LLM_ENABLE_PR_COMMENTS: "1"
      RB_LLM_ENABLE_ISSUE_ONLY: "0"
      RB_LLM_BATCH_ENABLE: "0"
      RB_EMBED_ENABLED: "0"
      RB_CHECK_RUN_PUBLISH_MODE: "deferred"
      RB_GH_APP_ID: ${{ vars.RB_GH_APP_ID }}
      RB_GH_APP_REPOSITORY_SELECTION: ${{ vars.RB_GH_APP_REPOSITORY_SELECTION }}
    steps:
      - uses: actions/github-script@v7
        id: ack
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/repobrain')
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comment_id = context.payload.comment.id;
            const res = await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id, content: "eyes"
            });
            core.setOutput("reaction_id", String(res.data.id));
      - uses: actions/github-script@v7
        id: checkout_ref
        with:
          script: |
            let ref = context.sha;
            let reason = "default_workflow_sha";
            if (context.eventName === "issue_comment" && context.payload.issue?.pull_request) {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const pullNumber = Number(context.payload.issue.number);
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              const baseRepo = `${owner}/${repo}`.toLowerCase();
              const headRepo = String(pull.head?.repo?.full_name || "").toLowerCase();
              const headSha = String(pull.head?.sha || "").trim();
              if (headRepo === baseRepo && headSha && String(pull.state || "").toLowerCase() === "open") {
                ref = headSha;
                reason = "same_repo_pr_head_sha";
              } else if (headRepo !== baseRepo) {
                reason = "fork_pr_uses_default_branch_runtime";
              } else if (String(pull.state || "").toLowerCase() !== "open") {
                reason = "closed_pr_uses_default_branch_runtime";
              } else {
                reason = "missing_pr_head_sha";
              }
            }
            core.info(`RepoBrain checkout ref resolution: ${reason} -> ${ref}`);
            core.setOutput("ref", ref);
            core.setOutput("reason", reason);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.ref }}
      - name: Restore RepoBrain index cache
        id: index_cache
        uses: actions/cache@v4
        with:
          path: artifacts/index-package.zip
          key: repobrain-index-main-${{ github.sha }}
          restore-keys: |
            repobrain-index-main-
      - name: Restore RepoBrain retrieval snapshot cache
        id: snapshot_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: artifacts/.repobrain_cache
          key: repobrain-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            repobrain-snapshot-
      - name: Apply workflow_dispatch toggles
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RB_LLM_ENABLED=${{ inputs.enable_llm && '1' || '0' }}" >> $GITHUB_ENV
          echo "RB_LLM_PROVIDER=github_models" >> $GITHUB_ENV
          echo "RB_EMBED_ENABLED=${{ inputs.enable_embeddings && '1' || '0' }}" >> $GITHUB_ENV
          echo "RB_LLM_BATCH_ENABLE=${{ inputs.enable_batch_llm && '1' || '0' }}" >> $GITHUB_ENV
          echo "RB_LLM_BATCH_FORCE=${{ inputs.batch_force && '1' || '0' }}" >> $GITHUB_ENV
          echo "RB_TRUSTED_CONTEXT=${{ inputs.trusted_context && '1' || '0' }}" >> $GITHUB_ENV
          echo "RB_ALLOW_DYNAMIC_VERIFY=${{ inputs.allow_dynamic_verify && '1' || '0' }}" >> $GITHUB_ENV
          echo "RB_APPLY_PATCH=${{ inputs.apply_patch && '1' || '0' }}" >> $GITHUB_ENV
          echo "RB_CREATE_PR=${{ inputs.create_pr && '1' || '0' }}" >> $GITHUB_ENV
          echo "RB_E2E_COMMAND=${{ inputs.e2e_command }}" >> $GITHUB_ENV
          echo "RB_E2E_PR_NUMBER=${{ inputs.e2e_pr_number }}" >> $GITHUB_ENV
          echo "RB_E2E_REF=${{ inputs.e2e_ref }}" >> $GITHUB_ENV
      - uses: ./. 
        env:
          RB_INDEX_CACHE_RESTORED: ${{ steps.index_cache.outputs.cache-hit == 'true' && '1' || '' }}
          RB_REQUIRE_VERIFY_FOR_PATCH: "0"
          RB_FAIL_ON_NOT_RUN: "0"
          RB_LLM_MODEL_HIGH: "openai/gpt-4.1"
          RB_LLM_MODEL_LOW: "openai/gpt-4.1-mini"
          RB_LLM_MAX_INPUT_TOKENS: "7600"
          RB_LLM_MAX_OUTPUT_TOKENS_GLOBAL: "2000"
          RB_LLM_MAX_OUTPUT_TOKENS_ASK: "1000"
          RB_LLM_MAX_OUTPUT_TOKENS_REVIEW: "1400"
          RB_LLM_MAX_OUTPUT_TOKENS_FIX: "2000"
          RB_LLM_ALLOW_LOCATE: "0"
          RB_LLM_BATCH_MAX_CALLS_PER_RUN: "6"
          RB_LLM_BATCH_REDUCE_ENABLE: "1"
          RB_LLM_BATCH_REDUCE_MODEL: ""
          RB_EMBED_MODEL: "openai/text-embedding-3-small"
          RB_EMBED_BATCH_SIZE: "64"
          RB_RETRIEVAL_VECTOR_TOPK: "30"
          RB_RETRIEVAL_W_LEX: "0.55"
          RB_RETRIEVAL_W_VEC: "0.45"
          RB_AI_STOP_AT_REMAINING: "1"
          RB_AI_MIN_REMAINING_BUFFER: "2"
          RB_AI_MAX_LLM_CALLS_PER_RUN: "6"
          RB_AI_MAX_EMBED_CALLS_PER_RUN: "10"
          RB_AI_DISABLE_REDUCE_WHEN_REMAINING_LT: "3"
          RB_AI_SWITCH_TO_MINI_WHEN_REMAINING_LT: "5"
          RB_AI_DISABLE_EMBED_WHEN_REMAINING_LT: "3"
          RB_AI_ESTIMATE_MODE_CONSERVATIVE: "1"
          RB_AI_MAX_TOKENS_PER_RUN_LLM: "12000"
          RB_AI_MAX_TOKENS_PER_RUN_EMBED: "200000"
          RB_AI_TIME_BUDGET_S: "240"
        with:
          # remote_url intentionally not set here; use repobrain_remote_stub_test.yml for stub remote tests.
          tky_mode: "auto"
          dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          comment_text: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.comment_text || '' }}
          issue_number: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || '' }}
      - name: Save RepoBrain retrieval snapshot cache
        if: always() && hashFiles('artifacts/.repobrain_cache/*') != ''
        uses: actions/cache/save@v4
        with:
          path: artifacts/.repobrain_cache
          key: ${{ steps.snapshot_cache_restore.outputs.cache-primary-key }}
      - uses: actions/github-script@v7
        if: always() && github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/repobrain')
        env:
          REACTION_ID: ${{ steps.ack.outputs.reaction_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comment_id = context.payload.comment.id;
            const reaction_id = process.env.REACTION_ID;
            if (reaction_id) {
              try {
                await github.rest.reactions.deleteForIssueComment({
                  owner, repo, comment_id, reaction_id: Number(reaction_id)
                });
              } catch (e) {
                // ignore
              }
            }
            const status = (process.env.JOB_STATUS || "").toLowerCase();
            const content = status === "success" ? "rocket" : "confused";
            await github.rest.reactions.createForIssueComment({ owner, repo, comment_id, content });
      - name: Upload RepoBrain audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-audit
          path: artifacts/audit/*.json
          if-no-files-found: ignore
      - name: Upload RepoBrain index package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-index-package
          path: artifacts/index-package.zip
          if-no-files-found: ignore
      - name: Upload RepoBrain ask markdown artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-ask-result
          path: artifacts/ask_result.md
          if-no-files-found: ignore
      - name: Upload RepoBrain diagnostic summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-diagnostic-summary
          path: artifacts/diagnostic_summary.md
          if-no-files-found: ignore
      - name: Generate RepoBrain TKYA evidence pack
        if: always()
        shell: bash
        run: |
          python scripts/gen_tkya_evidence_pack.py \
            --audit-dir artifacts/audit \
            --output-dir artifacts/evidence_pack
      - name: Upload RepoBrain TKYA evidence pack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-tkya-evidence-pack
          path: |
            artifacts/evidence_pack/repobrain_tkya_evidence_pack_internal.json
            artifacts/evidence_pack/repobrain_tkya_evidence_pack_public_safe.json
            artifacts/evidence_pack/repobrain_tkya_evidence_pack.md
          if-no-files-found: error
      - name: Generate RepoBrain stability benchmark artifacts
        if: always()
        shell: bash
        run: |
          python scripts/gen_stability_benchmark.py \
            --audit-dir artifacts/audit \
            --output-json artifacts/benchmarks/repobrain_stability_benchmark.json \
            --output-md artifacts/benchmarks/repobrain_stability_benchmark.md
      - name: Upload RepoBrain stability benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-stability-benchmark
          path: |
            artifacts/benchmarks/repobrain_stability_benchmark.json
            artifacts/benchmarks/repobrain_stability_benchmark.md
          if-no-files-found: ignore
      - name: Generate RepoBrain install readiness artifacts
        if: always()
        shell: bash
        env:
          RB_GH_APP_ID: ${{ secrets.RB_GH_APP_ID }}
          RB_GH_APP_INSTALLATION_ID: ${{ secrets.RB_GH_APP_INSTALLATION_ID }}
          RB_GH_APP_PRIVATE_KEY: ${{ secrets.RB_GH_APP_PRIVATE_KEY }}
          RB_GH_APP_PRIVATE_KEY_PATH: ${{ vars.RB_GH_APP_PRIVATE_KEY_PATH }}
          RB_GH_APP_WEBHOOK_SECRET: ${{ secrets.RB_GH_APP_WEBHOOK_SECRET }}
          RB_GH_APP_REPOSITORY_SELECTION: ${{ vars.RB_GH_APP_REPOSITORY_SELECTION }}
          RB_GH_APP_SELECTED_REPOS: ${{ vars.RB_GH_APP_SELECTED_REPOS }}
        run: |
          python scripts/check_install_readiness.py \
            --workflow .github/workflows/repobrain.yml \
            --output-json artifacts/onboarding/repobrain_install_readiness.json \
            --output-md artifacts/onboarding/repobrain_install_readiness.md
      - name: Upload RepoBrain install readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-install-readiness
          path: |
            artifacts/onboarding/repobrain_install_readiness.json
            artifacts/onboarding/repobrain_install_readiness.md
          if-no-files-found: ignore
      - name: Upload RepoBrain patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-patch
          path: artifacts/patch.diff
          if-no-files-found: ignore
      - name: Upload RepoBrain patch parts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-patch-parts
          path: artifacts/patch_parts/*
          if-no-files-found: ignore
      - name: Upload RepoBrain patch generation debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-patch-generation-debug
          path: artifacts/patch_generation_debug.json
          if-no-files-found: ignore
      - name: Upload RepoBrain LLM HTTP debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-llm-http-debug
          path: artifacts/llm_http_debug.json
          if-no-files-found: ignore
      - name: Upload RepoBrain verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-verification
          path: artifacts/verification_report.json
          if-no-files-found: ignore
      - name: Upload RepoBrain batch summaries artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-batch-summaries
          path: artifacts/batch_summaries.json
          if-no-files-found: ignore
      - name: Upload RepoBrain check-run payload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-check-run-payload
          path: artifacts/check_run_payload.json
          if-no-files-found: ignore
      - name: Upload RepoBrain LLM usage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-llm-usage
          path: artifacts/llm_usage.json
          if-no-files-found: ignore
      - name: Upload RepoBrain embeddings usage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-embeddings-usage
          path: artifacts/embeddings_usage.json
          if-no-files-found: ignore
      - name: Upload RepoBrain embeddings evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-index-embeddings-evidence
          path: artifacts/index_embeddings_evidence.json
          if-no-files-found: ignore
      - name: Upload RepoBrain AI quota snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-ai-quota-snapshot
          path: artifacts/ai_quota_snapshot.json
          if-no-files-found: ignore
      - name: Upload RepoBrain config snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repobrain-config-snapshot
          path: artifacts/config_snapshot.json
          if-no-files-found: ignore
