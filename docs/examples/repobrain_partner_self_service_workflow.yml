name: RepoBrain Partner Self-Service

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  repobrain:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/repobrain')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: alexworkingai/RepoBrain-Action@main
        with:
          profile: partner-pilot
          terms_accepted: "true"
          # Experimental and future external-runtime mode only.
          # Do not use this hosted path as the default trusted beta setup.
          # A real external runtime is required before self_service_mode can be used live.
          api_url: https://repobrain.example.invalid
          oidc_audience: repobrain-api
          self_service_mode: "true"

# Planned GitHub-native beta path after Sprint 94A:
# - partner repo uses the public RepoBrain action surface
# - RepoBrain request is queued through GitHub-native control-plane plumbing
# - a private control worker executes through private TopoCore
# - a public-safe response is posted back to GitHub
# This planned path is being implemented in Sprints 94B-94E.
